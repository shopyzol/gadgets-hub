<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>גאדג&#x27;טים שווים — כל המוצרים מהסרטונים</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b1220;--card:#121c31;--gold:#ffd232;--txt:#f3f5fa;--mut:#9aa6c2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Arial,sans-serif}
header{padding:28px 18px 10px;text-align:center}h1{margin:0;font-size:26px}
.sub{color:var(--mut);font-size:14px;margin-top:6px}
.search{margin:14px auto 0;max-width:520px;display:flex;gap:8px;padding:0 18px}
.search input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid #2a3a5e;background:#0f1830;color:var(--txt);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px 18px 40px;max-width:980px;margin:0 auto}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:12px}
.card:target{outline:3px solid var(--gold)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#0f1830}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.no{color:var(--gold);font-weight:700;font-size:13px}
.t{font-size:15px;line-height:1.3;flex:1}
.btn{display:block;text-align:center;background:var(--gold);color:#111;font-weight:800;text-decoration:none;padding:10px;border-radius:10px;font-size:15px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:10px 18px 30px;line-height:1.6}
</style>
</head>
<body>
<header>
<h1>גאדג&#x27;טים שווים</h1>
<div class="sub">כל המוצרים מהסרטונים · לחצו על המספר שראיתם בסרטון</div>
<div class="search"><input id="q" placeholder="חפשו לפי מספר (#012) או שם…" oninput="f()"></div>
</header>
<div class="grid" id="g">
<a class="card" id="p001" data-k="001 משאבת אוויר חכמה לרכב" href="https://s.click.aliexpress.com/e/_TEST" target="_blank" rel="nofollow noopener sponsored">
<img src="https://ae01.alicdn.com/kf/test.jpg" alt="" loading="lazy">
<div class="b"><div class="no">#001</div><div class="t">משאבת אוויר חכמה לרכב</div><span class="btn">לאלי אקספרס ›</span></div>
</a>
</div>
<footer>קישורי שותפים (AliExpress Affiliate): אנחנו מקבלים עמלה קטנה על רכישה דרך הקישורים — המחיר לכם לא משתנה.<br>עודכן 14.09.2026</footer>
<script>
function f(){var q=document.getElementById('q').value.trim().replace('#','').toLowerCase();
document.querySelectorAll('.card').forEach(function(c){c.style.display=(!q||c.dataset.k.indexOf(q)>-1)?'':'none';});}
if(location.hash){var el=document.querySelector(location.hash);if(el)el.scrollIntoView();}
</script>
</body>
</html>
